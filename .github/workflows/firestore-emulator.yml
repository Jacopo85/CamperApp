name: Firestore rules emulator
on:
  pull_request:
    paths:
      - firestore.rules
      - app.js
      - index.html
      - firebase.json
      - package.json
      - tests/firestore-emulator.test.mjs
      - .github/workflows/firestore-emulator.yml
  workflow_dispatch:
jobs:
  firestore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-camperapp-security --config firebase.json "npm run test:rules"
