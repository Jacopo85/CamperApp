name: CamperApp browser smoke (Firebase emulators)
on:
  pull_request:
    paths:
      - app.js
      - index.html
      - firestore.rules
      - firebase.json
      - package.json
      - playwright.config.mjs
      - tests/e2e.spec.mjs
      - .github/workflows/browser-emulator.yml
  workflow_dispatch:
jobs:
  android-viewport-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: E2E with demo Firebase emulators (no production access)
        run: npx firebase emulators:exec --only auth,firestore --project demo-camperapp-security --config firebase.json "npm run test:e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: camperapp-browser-test-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
