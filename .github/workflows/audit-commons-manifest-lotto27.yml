name: CamperApp - audit Commons remoto (Lotto 27, non pubblicare)
on:
  push:
    branches:
      - audit/commons-manifest-20261108
permissions:
  contents: read
jobs:
  commons-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparare programma e manifest firmati dal ramo di audit
        shell: bash
        run: |
          mkdir -p tools AUDIT_COMMONS_REMOTO
          base64 --decode audit/worker_lotto27.py.gz.b64 | gzip -d > tools/audit_commons_manifest_lotto27.py
          base64 --decode audit/manifest_lotto27.json.gz.b64 | gzip -d > AUDIT_COMMONS_REMOTO/MANIFEST.json
          python -m pip install 'Pillow>=11,<13'
      - name: Verificare 66 foto senza caricare immagini locali nel repository
        run: |
          python tools/audit_commons_manifest_lotto27.py \
            --manifest AUDIT_COMMONS_REMOTO/MANIFEST.json \
            --output AUDIT_COMMONS_REMOTO \
            --timeout 25 --pause 0.4
      - name: Diagnosticare metadati licenza non coincidenti
        shell: bash
        run: |
          python - <<'PYCODE'
          import csv,json,urllib.parse,urllib.request
          rows=list(csv.DictReader(open('AUDIT_COMMONS_REMOTO/ESITI_66.csv',encoding='utf-8-sig')))
          data=[]
          for r in rows:
              if r['license_match']=='SI':continue
              title='File:'+urllib.parse.unquote(r['commons_page'].split('/wiki/File:',1)[-1]).replace('_',' ')
              q=urllib.parse.urlencode({'action':'query','titles':title,'prop':'imageinfo','iiprop':'extmetadata','format':'json','formatversion':'2'})
              req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+q,headers={'User-Agent':'CamperApp-Photo-Audit/2026.11.08 (+https://github.com/Jacopo85/CamperApp)'})
              with urllib.request.urlopen(req,timeout=15) as f:api=json.load(f)
              meta=api['query']['pages'][0]['imageinfo'][0].get('extmetadata',{})
              data.append({'territorio':r['territorio'],'short_name':meta.get('LicenseShortName',{}).get('value'),'license_url':meta.get('LicenseUrl',{}).get('value'),'artist':meta.get('Artist',{}).get('value','')[:250]})
          with open('AUDIT_COMMONS_REMOTO/DIAGNOSTICA_LICENZE.json','w') as f:json.dump(data,f,indent=2,ensure_ascii=False)
          PYCODE
      - name: Salvare rapporti anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camperapp-commons-lotto27-non-pubblicare
          path: |
            AUDIT_COMMONS_REMOTO/ESITI_66.csv
            AUDIT_COMMONS_REMOTO/RIEPILOGO.json
            AUDIT_COMMONS_REMOTO/DIAGNOSTICA_LICENZE.json
          if-no-files-found: warn
          retention-days: 30
